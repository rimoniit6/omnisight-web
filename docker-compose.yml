services:
  db:
    image: postgres:15-alpine
    container_name: omnisight_db
    restart: always
    environment:
      POSTGRES_USER: omnisight_user
      POSTGRES_PASSWORD: omnisight_password
      POSTGRES_DB: omnisight_db
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - omnisight_network

volumes:
  pgdata:

networks:
  omnisight_network:
    driver: bridge